<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FleetCare Ops</title>
<style>
:root{--bg:#0f1419;--card:#18202a;--line:#263241;--tx:#e6edf3;--mut:#8b9bb0;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}h1 span{color:var(--acc)}.tag{color:var(--mut);font-size:12px}
main{padding:20px 28px;max-width:1880px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.kpi b{font-size:26px;display:block}.kpi small{color:var(--mut)}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px}@media(max-width:1300px){.grid3{grid-template-columns:1fr 1fr}}@media(max-width:900px){.grid3{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
.critical{background:#5a1d1d;color:#ffb3ad}.high{background:#5a3b12;color:#ffd08a}.medium{background:#4a4210;color:#f2e08a}.low{background:#1e3a26;color:#9fe0ae}
.draft{background:#1d3350;color:#9ccbff}.review{background:#5a3b12;color:#ffd08a}.closed{background:#2a2f36;color:var(--mut)}.okp{background:#1e3a26;color:#9fe0ae}
.bar{height:6px;border-radius:3px;background:#0b0f14;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ok)}.bar i.low{background:var(--bad)}
@keyframes fl{from{background:#27456b}to{background:transparent}}tr.new{animation:fl 1.8s ease-out}
.mut{color:var(--mut)}.note{font-size:12px;color:var(--mut);margin-top:6px}
</style></head><body>
<header><h1>Fleet<span>Care</span> Ops</h1><div class="tag">Synthetic data. Agent actions are drafts only. Live.</div></header>
<div id="cap" style="display:none;background:#1d3350;color:#cfe5ff;padding:10px 28px;font-weight:600;border-bottom:1px solid var(--line)"></div>
<main>
<div class="kpis" id="kpis"></div>
<div class="grid3"><div>
<section><h2>Alerts and recommended service center</h2><table id="alerts"></table></section>
<section><h2>Work orders (drafts)</h2><table id="wos"></table><div class="note" id="wonote"></div></section>
</div><div>
<section><h2>Parts stock</h2><table id="parts"></table></section>
<section><h2>Purchase orders (drafts)</h2><table id="pos"></table><div class="note" id="ponote"></div></section>
</div><div>
<section><h2>Live agent activity (API calls)</h2><table id="act"></table></section>
<section><h2>Guardrails: refused actions</h2><table id="rej"></table></section>
</div></div></main>
<script>
const $=id=>document.getElementById(id), inr=n=>'Rs '+Number(n).toLocaleString('en-IN');
const pill=(t,c)=>`<span class="pill ${c||t}">${t}</span>`;
var load=async function(){
 const d=await (await fetch('/dashboard/data')).json(), s=d.summary;
 const veh=s.vehicles_by_status.map(v=>`${v.n} ${v.status.replace('_',' ')}`).join(', ');
 const openA=s.open_alerts_by_severity.reduce((a,b)=>a+b.n,0), crit=(s.open_alerts_by_severity.find(x=>x.severity==='critical')||{n:0}).n;
 $('kpis').innerHTML=[['Vehicles',s.vehicles_by_status.reduce((a,b)=>a+b.n,0),veh],['Open alerts',openA,crit+' critical'],['Low-stock parts',s.low_stock_parts,'at or below reorder point'],
  ['Draft work orders',s.draft_work_orders,s.work_orders_needing_review+' need human review'],['Draft purchase orders',s.draft_purchase_orders,inr(s.draft_purchase_total)]].map(k=>`<div class="kpi"><small>${k[0]}</small><b>${k[1]}</b><small>${k[2]}</small></div>`).join('');
 const hasWO=new Set(d.work_orders.map(w=>w.alert_id));
 $('alerts').innerHTML='<tr><th>Severity</th><th>Vehicle</th><th>Alert</th><th>Recommended center</th><th></th></tr>'+d.alerts.map(a=>{
  const r=a.recommended, rec=r?`${r.name} <span class="mut">(${r.region})</span>`+(r.needs_human_review?`<br><span class="mut">needs review: ${r.review_reason}</span>`:''):'<span class="mut">none: escalate</span>';
  return `<tr><td>${pill(a.severity)}</td><td>${a.plate}<br><span class="mut">${a.region}</span></td><td>${a.description}<br><span class="mut">${a.needed_specialty}</span></td><td>${a.status==='open'?rec:'<span class="mut">-</span>'}</td><td>${a.status==='closed'?pill('closed'):hasWO.has(a.id)?pill('draft WO','draft'):pill('no WO yet','review')}</td></tr>`}).join('');
 $('wos').innerHTML=d.work_orders.length?'<tr><th>#</th><th>Alert</th><th>Center</th><th>Summary</th><th></th></tr>'+d.work_orders.map(w=>`<tr><td>${w.id}</td><td>${w.alert_id}</td><td>${w.center}</td><td>${w.summary}${w.review_reason?`<br><span class="mut">${w.review_reason}</span>`:''}</td><td>${w.needs_human_review?pill('human review','review'):pill('draft')}</td></tr>`).join(''):'<tr><td class="mut">No work orders yet. Ask the agent to triage the open alerts.</td></tr>';
 $('wonote').textContent=d.work_orders.length?'Nothing is dispatched. A person approves every draft.':'';
 $('parts').innerHTML='<tr><th>Part</th><th>Stock</th><th>Reorder at</th></tr>'+d.parts.map(p=>{const low=p.stock<=p.reorder_point,w=Math.min(100,p.stock/(p.reorder_point*2)*100);
  return `<tr><td>${p.name}<div class="bar"><i class="${low?'low':''}" style="width:${w}%"></i></div></td><td>${p.stock} ${low?pill('low','critical'):''}</td><td>${p.reorder_point}</td></tr>`}).join('');
 $('pos').innerHTML=d.purchase_orders.length?'<tr><th>#</th><th>Lines (part x qty)</th><th>Total</th></tr>'+d.purchase_orders.map(p=>`<tr><td>${p.id}</td><td>${p.lines.split(',').map(l=>{const[i,q]=l.split('x');const pt=d.parts.find(x=>x.id==i);return (pt?pt.name:'part '+i)+' x '+q}).join('<br>')}</td><td>${inr(p.total)}<br>${pill(p.status)}</td></tr>`).join(''):'<tr><td class="mut">No purchase orders yet.</td></tr>';
 $('act').innerHTML=d.activity.length?d.activity.map(a=>`<tr class="fl" data-k="a${a.id}"><td class="mut" style="width:48px">${a.method}</td><td>${a.path}</td><td style="width:44px">${pill(a.status,a.status<400?'okp':'critical')}</td></tr>`).join(''):'<tr><td class="mut">Waiting for the agent...</td></tr>';
 $('rej').innerHTML=d.rejections.length?'<tr><th>Action</th><th>Why it was refused</th></tr>'+d.rejections.map(r=>`<tr><td>${r.action}<br>${pill(r.code,'critical')}</td><td>${r.reason}</td></tr>`).join(''):'<tr><td class="mut">Nothing refused yet. Bad calls (wrong specialty, duplicates, closed alerts) are blocked here and logged.</td></tr>';
 $('ponote').textContent=d.purchase_orders.length?'Draft only. Not sent to any supplier.':'';
}
const cp=new URLSearchParams(location.search).get("caption");if(cp){$("cap").style.display="block";$("cap").textContent=cp}
const seen=new Set();let first=true;
function mark(){document.querySelectorAll('#wos tr,#pos tr,#rej tr,#act tr').forEach(tr=>{const k=tr.dataset.k||(tr.closest('table').id+':'+tr.innerText.slice(0,40));if(!seen.has(k)){seen.add(k);if(!first&&tr.querySelector('td'))tr.classList.add('new')}});first=false}
const _l=load;load=async function(){await _l();mark()};
load();setInterval(load,1500);
</script></body></html>
